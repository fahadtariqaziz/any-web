[project]
name = "ai-decision-arena"
version = "0.1.0"
description = "Multi-agent technical decision system (LangGraph + Claude + Tavily)"
authors = [
    { name = "fahadtariqaziz", email = "fahadtariqaziz1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.158.1",
    "grandalf>=0.8",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.11",
    "psutil>=7.2.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
